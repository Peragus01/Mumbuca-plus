[package]
name = "mumbuca_plus"
version = "0.1.0"
description = "Mumbuca+ Token-2022 mint with on-chain payment receipts"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "mumbuca_plus"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.0", default-features = false, features = ["associated_token", "token", "token_2022", "token_2022_extensions"] }

[dev-dependencies]
litesvm = "0.18.2"
solana-message = "4.6.0"
solana-transaction = "4.3.0"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
